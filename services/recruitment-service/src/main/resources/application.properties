spring.application.name=recruitment-service

# Qdrant Configuration
qdrant.url=${QDRANT_URL:http://qdrant:6333}

# Elasticsearch Configuration
elasticsearch.url=${ELASTICSEARCH_URL:http://elasticsearch:9200}
elasticsearch.host=elasticsearch
elasticsearch.port=9200

# Spring Data Elasticsearch Configuration
spring.data.elasticsearch.client.reactive.endpoints=${ELASTICSEARCH_URL:http://elasticsearch:9200}
spring.data.elasticsearch.repositories.enabled=true
spring.data.elasticsearch.client.reactive.connection-timeout=30s
spring.data.elasticsearch.client.reactive.socket-timeout=30s

# Server Configuration
server.port=${SERVER_PORT:8081}

# Logging
logging.level.com.itcompany.recruitment=DEBUG
logging.level.org.springframework.data.elasticsearch=DEBUG

# Management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Data Loader configuration - enable for development
data.loader.enabled=true